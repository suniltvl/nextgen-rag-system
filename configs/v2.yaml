name: v2
description: 'V2: semantic chunking, bge-small-en-v1.5 embeddings, in-memory Chroma
  index, dense top-5 retrieval, grounded prompt.'
data:
  subset: covidqa
  split: train
  limit: 50
chunker:
  kind: semantic
  chunk_size: 256
  overlap: 32
embedder:
  kind: sentence_transformer
  model_name: BAAI/bge-small-en-v1.5
  batch_size: 64
  normalize: true
vectorstore:
  kind: chroma
  collection_prefix: rag_kag_v1
retriever:
  kind: dense
  top_k: 5
generator:
  kind: llm
  model: ollama_chat/gemma4:e4b
  temperature: 0.0
  max_tokens: 512
  prompt_template: grounded_default
output_dir: experiments/runs
seed: 42
