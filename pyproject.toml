[project]
name = "rag-kag-capstone"
version = "0.1.0"
description = "Domain-specific RAG evaluation and optimization with a controlled KAG enhancement layer (IIIT-H capstone)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Shiva" },
    { name = "Sunil" },
    { name = "Sourav" },
    { name = "Vinay" },
]

dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0.1",
    "typer>=0.12",
    "rich>=13.7",
    "tqdm>=4.66",
    "python-dotenv>=1.0",

    # Data
    "datasets>=2.20",
    "pandas>=2.2",
    "numpy>=1.26,<2.3",

    # Embeddings & retrieval
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "chromadb>=0.5",
    "bm25s>=0.2",
    "rank-bm25>=0.2.2",

    # NLP utilities
    "nltk>=3.9",
    "scikit-learn>=1.4",

    # LLM gateway
    "litellm>=1.40",

    # KAG (Phase 3)
    "networkx>=3.3",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
    "types-tqdm",
]

[project.scripts]
rag-kag = "rag_kag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_kag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring a GPU",
    "network: marks tests requiring network access",
]
