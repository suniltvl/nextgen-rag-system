[project]
name = "real-world-rag-system"
version = "0.1.0"
description = "Production-grade Retrieval-Augmented Generation system with semantic chunking, hybrid retrieval, reranking, and RAGBench evaluation."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [

    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",

    # Config
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.0",

    # Logging
    "loguru>=0.7.3",
    "python-json-logger>=3.3.0",

    # Serialization
    "orjson>=3.10.18",

    # Data
    "numpy<2",
    "pandas>=2.2.3",

    # LLM
    "openai>=1.93.0",

    # LangChain
    "langchain>=0.3.26",
    "langchain-core>=0.3.68",
    "langchain-community>=0.3.27",
    "langchain-openai>=0.3.28",
    "langchain-huggingface>=0.3.0",

    # Embeddings / Transformers
    "torch==2.5.1",
    "torchvision==0.20.1",
    # "transformers==4.48.3",
    "sentence-transformers==3.4.1",
    "accelerate==1.3.0",

    # Vector Stores
    "chromadb>=1.0.15",
    "langchain-chroma>=0.2.4",

    "qdrant-client>=1.15.0",
    "langchain-qdrant>=0.2.0",

    # Retrieval
    "faiss-cpu>=1.11.0",
    "rank-bm25>=0.2.2",

    # Reranking
    "FlagEmbedding==1.3.3",

    # Chunking
    "tiktoken>=0.9.0",

    # Documents
    "pypdf>=5.7.0",
    "pymupdf>=1.26.3",

    # Evaluation
    "datasets",
    "evaluate>=0.4.5",
    "ragas>=0.3.0",

    # Model APIs
    "google-genai>=1.45.0",
    "cerebras-cloud-sdk>=1.7.0",
    "openrouter>=0.2.5",
]

[project.optional-dependencies]

ui = [
    "streamlit>=1.46.1",
]

dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "httpx>=0.28.1",
    "black>=25.1.0",
    "ruff>=0.12.1",
    "mypy>=1.16.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "notebook>=7.4.4",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }