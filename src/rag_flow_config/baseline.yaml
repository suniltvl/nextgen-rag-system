experiment:
  name: baseline_rag
  version: 1.0

pipeline:
  query_classification: false
  reranking: false
  summarization: false

chunking:
  strategy: recursive # fixed_size, recursive, semantic, sentence
  chunk_size: 512
  chunk_overlap: 100

embedding:
  provider: huggingface
  model: BAAI/bge-small-en-v1.5

vector_store:
  provider: chroma
  collection_name: baseline
  persist_directory: ./db/chroma_db

retrieval:
  type: similarity
  top_k: 5

generator:
  provider: lmstudio
  # model_name: "mistral-7b-instruct-v0.3" #"google/gemma-4-e2b"
  model_name: "google/gemma-4-e2b"
  temperature: 0
  api_key: ${LMSTUDIO_API_KEY}
  base_url: ${LMSTUDIO_BASE_URL}

evaluation:
  dataset: ragbench
  metrics:
    - context_relevance
    - context_utilization
    - answer_faithfulness
    - answer_completeness